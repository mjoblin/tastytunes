name: Release

# Builds installers and attaches them to a GitHub Release.
# Trigger by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab via workflow_dispatch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder uploads release assets
  id-token: write # GitHub OIDC token for Azure Artifact Signing (no stored secret)

jobs:
  # mac + linux. DELIBERATELY NO `environment:` here — when all three legs
  # shared the `release` environment, GitHub's deployment model treated the
  # concurrent jobs as supersedable deployments and reaped the mac/linux legs
  # mid-run (~15 minutes in, twice, 2026-08-06). Only Windows needs the
  # environment, because only Windows exchanges an OIDC token.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # universal = one dmg/zip for Intel AND Apple Silicon (plain
            # --mac on the arm64 runner would ship Apple-Silicon-only)
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Tag builds refuse to run unless the tag agrees with package.json —
      # package.json is THE version (electron-builder bakes it into the
      # artifacts, the app's About, and the update feed); the tag only names
      # the release. A mismatch would publish a release labeled one version
      # containing another, and the in-app update check (latest release tag
      # vs baked version) would offer the "new" version forever.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on develop, then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      # Import macOS signing/notarization credentials when the repo secrets
      # exist. Absent secrets (e.g. on a fork) disable identity auto-discovery
      # so the build falls through to unsigned, notarization skipped.
      # Note: auto-discovery must stay ON when CSC_LINK is set — it is how
      # electron-builder finds the imported cert in its temporary keychain.
      - name: Set up macOS signing credentials
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            {
              echo "CSC_LINK=$MAC_CERT_P12"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - run: npm ci

      # typecheck + lint + format:check — the same gate as `npm run check` locally
      - run: npm run check

      - run: npm run build

      # On a tag: build and upload the installers to the GitHub Release.
      # On manual runs: build only; artifacts are attached to the workflow run.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release version (v0.3.0-rc.1) must land as a PRE-RELEASE draft:
      # electron-builder does not set the flag on the draft it creates (checked
      # on the first live rc, 2026-08-19), and a draft published without it
      # becomes "latest" — the website's latest/download links and every stable
      # updater would take the rc. Idempotent; each leg may run it.
      - name: Mark a pre-release version's draft as pre-release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder ${{ matrix.args }} --publish never

      # MANUAL RUNS ONLY. On a tag the installers are already attached to the
      # GitHub Release by --publish always above, and release assets do NOT
      # count against the Actions storage allowance — uploading them here too
      # just stores the same files a second time, per release, where they DO
      # count. Manual runs have no Release to attach to, so that is the one
      # case the artifact earns its keep. Retention is short for the same
      # reason: these are throwaway test builds.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tastytunes-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore

  # Windows, in its OWN job: the `release` environment is what the Entra
  # federated credential trusts (subject
  # repo:mjoblin/tastytunes:environment:release) — without it the azure/login
  # OIDC exchange is rejected. Kept off the matrix so the environment's
  # deployment semantics can't touch the other legs (see the note above).
  build-windows:
    runs-on: windows-latest
    environment: release
    # A signed dual-arch build is slower than unsigned (per-file service
    # round-trips) but 45 minutes means something is stuck, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on develop, then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      - run: npm ci

      # typecheck + lint + format:check — the same gate as `npm run check` locally
      - run: npm run check

      - run: npm run build

      # Azure Artifact Signing auth. OIDC only — no long-lived secret exists
      # anywhere; the exchanged token is scoped to the signer role on the
      # redactedcatsigning account. build-win.mjs turns signing on when it
      # sees AZURE_TENANT_ID in the env.
      - name: Azure login for Artifact Signing
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Expose Azure signing env
        shell: bash
        # AZURE_TOKEN_CREDENTIALS=dev pins Azure.Identity's credential chain
        # to the CLI-session credentials the login step just created, skipping
        # the EnvironmentCredential/ManagedIdentity probes — GitHub's runners
        # live in Azure, so the IMDS probe ANSWERS and then fails slowly, per
        # signed file. The first signed run spent ~50 minutes mostly on that
        # (2026-08-06); harmlessly ignored by older Azure.Identity versions.
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_TOKEN_CREDENTIALS=dev" >> "$GITHUB_ENV"

      # Windows goes through scripts/build-win.mjs — it pins the 7z filter
      # (without it the arm64 installer ships broken) and injects the Azure
      # signing options; see that file.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark a pre-release version's draft as pre-release
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist:win -- --publish never

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tastytunes-windows
          retention-days: 7
          path: dist/*.exe
          if-no-files-found: ignore

  # Mac App Store lane: signed universal .pkg uploaded to TestFlight. Store
  # release stays a manual App Store Connect promotion — this never publishes.
  # Runs only when the MAS secrets exist; a repo without them (or a fork) gets
  # a skipped lane, never a red build.
  mas:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Secrets can't be read in step `if:` conditions — surface their
      # presence as a step output the rest of the lane keys off.
      - name: Check for Mac App Store secrets
        id: gate
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$MAS_CERT_P12" ] && [ -n "$MAS_PROVISIONING_PROFILE" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MAS lane skipped — missing MAS_CERT_P12 / MAS_PROVISIONING_PROFILE / APPLE_API_KEY_P8"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - if: steps.gate.outputs.enabled == 'true'
        run: npm run build

      # MAS_CERT_P12 is one base64 .p12 holding BOTH identities the mas target
      # signs with: "Apple Distribution" (app) and "Mac Installer Distribution"
      # (pkg). Same CSC_LINK temp-keychain mechanism as the Developer ID lane —
      # auto-discovery must stay on for electron-builder to find them.
      - name: Set up Mac App Store signing credentials
        if: steps.gate.outputs.enabled == 'true'
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          {
            echo "CSC_LINK=$MAS_CERT_P12"
            echo "CSC_KEY_PASSWORD=$MAS_CERT_PASSWORD"
          } >> "$GITHUB_ENV"
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/mas.provisionprofile"

      # buildVersion (CFBundleVersion) = run number so every upload is unique;
      # App Store Connect rejects a reused build number for the same version.
      - name: Package Mac App Store build
        if: steps.gate.outputs.enabled == 'true'
        run: >
          npx electron-builder --mac mas --universal --publish never
          -c.mas.provisioningProfile="$RUNNER_TEMP/mas.provisionprofile"
          -c.buildVersion="$GITHUB_RUN_NUMBER"

      # fastlane ships in the macOS runner image; pilot uploads via the App
      # Store Connect API key (no Apple ID / 2FA involved). Skip waiting for
      # processing — TestFlight availability shows up in ASC when Apple's done.
      - name: Upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          jq -n --arg kid "$APPLE_API_KEY_ID" --arg iss "$APPLE_API_ISSUER_ID" --arg key "$APPLE_API_KEY_P8" \
            '{key_id: $kid, issuer_id: $iss, key: $key, in_house: false}' > "$RUNNER_TEMP/asc_key.json"
          PKG=$(ls dist/*.pkg | head -1)
          echo "uploading $PKG"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --pkg "$PKG" \
            --app_platform osx \
            --skip_waiting_for_build_processing true

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tastytunes-mas
          path: dist/*.pkg
          if-no-files-found: ignore
