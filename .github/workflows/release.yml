name: Release

# Builds installers and attaches them to a GitHub Release.
# Trigger by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab via workflow_dispatch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder uploads release assets
# id-token: write (the OIDC token Azure Artifact Signing takes in place of a stored secret) is
# granted to the Windows signing job alone (sign-windows), which runs only the packager

jobs:
  # THE DRAFT IS CREATED ONCE, BEFORE ANY BUILD JOB. Every build job publishes
  # with electron-builder, which creates the GitHub draft for the tag when it
  # finds none, and two jobs publishing at the same moment each created one:
  # v0.8.0-rc.1 arrived as two drafts (2026-09-12), the mac assets in the one
  # the flag step reached, windows and linux in the other, merged by hand. It
  # had never bitten because the linux and windows publishes used to finish
  # minutes apart from the mac one; a 28-minute runner queue closed that gap.
  # With the draft already there every leg finds it and only uploads. The
  # pre-release flag is decided here from the tag's suffix (electron-builder
  # never sets it, checked on the first live rc, 2026-08-19; a draft published
  # without it becomes "latest"), so no per-leg edit step is needed. The job
  # runs on manual dispatches too, doing nothing, so the legs' `needs` holds.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        # no token left in .git/config for the steps after it (gh and the packaging read GH_TOKEN)
        with:
          persist-credentials: false
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on the branch being tagged (release/X.Y.Z for a pre-release, main for a final), then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      - name: Create the release draft
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; the legs will upload to it."
            exit 0
          fi
          FLAG=""
          case "$TAG" in *-*) FLAG="--prerelease" ;; esac
          gh release create "$TAG" --draft $FLAG --verify-tag --title "${TAG#v}" --notes ""
          echo "Draft created for $TAG${FLAG:+ (pre-release)}"

  # mac + linux. DELIBERATELY NO `environment:` here — when all three legs
  # shared the `release` environment, GitHub's deployment model treated the
  # concurrent jobs as supersedable deployments and reaped the mac/linux legs
  # mid-run (~15 minutes in, twice, 2026-08-06). Only Windows needs the
  # environment, because only Windows exchanges an OIDC token.
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # universal = one dmg/zip for Intel AND Apple Silicon (plain
            # --mac on the arm64 runner would ship Apple-Silicon-only)
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        # no token left in .git/config for the steps after it (gh and the packaging read GH_TOKEN)
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Tag builds refuse to run unless the tag agrees with package.json —
      # package.json is THE version (electron-builder bakes it into the
      # artifacts, the app's About, and the update feed); the tag only names
      # the release. A mismatch would publish a release labeled one version
      # containing another, and the in-app update check (latest release tag
      # vs baked version) would offer the "new" version forever.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on the branch being tagged (release/X.Y.Z for a pre-release, main for a final), then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      - run: npm ci

      # typecheck + lint + format:check + unit tests — the same gate as `npm run check` locally
      - run: npm run check

      - run: npm run build

      # On a tag: build and upload the installers to the GitHub Release.
      # On manual runs: build only; artifacts are attached to the workflow run.
      # The Mac's signing and notarization secrets are in this step's env only, the macOS leg's,
      # and become electron-builder's variables in .github/scripts/mac-signing.sh
      # A RE-RUN NEVER REPLACES A PUBLISHED RELEASE'S FILES: a leg re-run after the publish would
      # upload over installers people already have; it publishes only into the draft
      - name: The release is still a draft
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is published already: a re-run would replace its files. Cut a new version instead."
            exit 1
          fi

      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          . .github/scripts/mac-signing.sh
          npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CERT_P12: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 || '' }}
          MAC_CERT_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER_ID || '' }}

      # THE UPDATE FEED'S macOS MINIMUM (0.14.0, Electron 44 dropped macOS 12). electron-builder
      # writes the minimum into the app but not into latest-mac.yml, and the updater in copies
      # already installed reads it only there, against os.release(): the Darwin version, so 22.0.0
      # is macOS 13. Without it a Mac on macOS 12 would install an update it cannot open. The
      # release is still a draft here, so nobody is offered the file before it says so.
      - name: The update feed's macOS minimum
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: |
          node -e "const fs = require('fs'); const f = 'dist/latest-mac.yml'; let s = fs.readFileSync(f, 'utf8'); if (!/^minimumSystemVersion:/m.test(s)) s = s.replace(/\n*$/, '\n') + 'minimumSystemVersion: 22.0.0\n'; fs.writeFileSync(f, s)"
          grep -q '^minimumSystemVersion: 22.0.0$' dist/latest-mac.yml
          gh release upload "$GITHUB_REF_NAME" dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          . .github/scripts/mac-signing.sh
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          MAC_CERT_P12: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 || '' }}
          MAC_CERT_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER_ID || '' }}

      # THE MAC APP'S OWN UUIDS, read back from the signed app: every slice of the app's executable
      # and its helpers carries the UUID derived for this app, never Electron's stock one, which
      # every app on the same Electron release shares (macOS keeps the Local Network permission
      # by it). The hook that writes them is scripts/mac-uuid.mjs, run by electron-builder.
      - name: The Mac executables' own UUIDs
        if: runner.os == 'macOS'
        run: node scripts/mac-uuid.mjs --check dist/mac-universal/TastyTunes.app

      # MANUAL RUNS ONLY. On a tag the installers are already attached to the
      # GitHub Release by --publish always above, and release assets do NOT
      # count against the Actions storage allowance — uploading them here too
      # just stores the same files a second time, per release, where they DO
      # count. Manual runs have no Release to attach to, so that is the one
      # case the artifact earns its keep. Retention is short for the same
      # reason: these are throwaway test builds.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tastytunes-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore

  # Windows, in its OWN job: the `release` environment is what the Entra
  # federated credential trusts (subject
  # repo:mjoblin/tastytunes:environment:release) — without it the azure/login
  # OIDC exchange is rejected. Kept off the matrix so the environment's
  # deployment semantics can't touch the other legs (see the note above).
  # THE WINDOWS LEG IN TWO JOBS (0.16.0-rc.8). The OIDC token Azure Artifact Signing takes is in
  # the environment of every step of a job granted id-token: write, so the job that installs the
  # dependencies (their install scripts), runs the check and builds the app holds no such grant:
  # it hands the built app (out/) to the signing job, which installs with every install script off
  # (no production dependency has one) and runs only the packager, the one step that must sign.
  build-windows:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        # no token left in .git/config for the steps after it
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on the branch being tagged (release/X.Y.Z for a pre-release, main for a final), then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      - run: npm ci

      # typecheck + lint + format:check + unit tests — the same gate as `npm run check` locally
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tastytunes-windows-out
          retention-days: 1
          path: out/
          if-no-files-found: error

  sign-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write # electron-builder uploads release assets
      id-token: write # GitHub OIDC token for Azure Artifact Signing (no stored secret)
    environment: release
    # A signed dual-arch build is slower than unsigned (per-file service
    # round-trips) but 45 minutes means something is stuck, not slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        # no token left in .git/config for the steps after it (the packaging reads GH_TOKEN)
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # the packager and the app's production dependencies, no install script run beside the
      # token (Electron's own binary is the packager's download, not an install script's)
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: tastytunes-windows-out
          path: out/

      # Azure Artifact Signing auth. OIDC only — no long-lived secret exists
      # anywhere; the exchanged token is scoped to the signer role on the
      # redactedcatsigning account. build-win.mjs turns signing on when it
      # sees AZURE_TENANT_ID in the env.
      - name: Azure login for Artifact Signing
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Expose Azure signing env
        shell: bash
        # AZURE_TOKEN_CREDENTIALS=dev pins Azure.Identity's credential chain
        # to the CLI-session credentials the login step just created, skipping
        # the EnvironmentCredential/ManagedIdentity probes — GitHub's runners
        # live in Azure, so the IMDS probe ANSWERS and then fails slowly, per
        # signed file. The first signed run spent ~50 minutes mostly on that
        # (2026-08-06); harmlessly ignored by older Azure.Identity versions.
        run: |
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_TOKEN_CREDENTIALS=dev" >> "$GITHUB_ENV"

      # Windows goes through scripts/build-win.mjs — it pins the 7z filter
      # (without it the arm64 installer ships broken) and injects the Azure
      # signing options; see that file. It packages the out/ the build job made
      # (the dist:win script would build the app again here).
      # A RE-RUN NEVER REPLACES A PUBLISHED RELEASE'S FILES: a leg re-run after the publish would
      # upload over installers people already have; it publishes only into the draft
      - name: The release is still a draft
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is published already: a re-run would replace its files. Cut a new version instead."
            exit 1
          fi

      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/build-win.mjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: node scripts/build-win.mjs --publish never

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tastytunes-windows
          retention-days: 7
          path: dist/*.exe
          if-no-files-found: ignore

  # EVERY INSTALLER ATTACHED BEFORE ANYONE PUBLISHES: the twelve files a release carries, read back
  # from the draft once every leg is done (a leg that published nothing used to show only in its
  # own log, and the check was by eye)
  verify:
    needs: [build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The draft carries every file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          have=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for f in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml \
            "TastyTunes-$version-universal-mac.zip" "TastyTunes-$version-universal-mac.zip.blockmap" \
            TastyTunes.dmg TastyTunes.dmg.blockmap TastyTunes-Setup.exe TastyTunes-Setup.exe.blockmap \
            TastyTunes-x86_64.AppImage TastyTunes-arm64.AppImage; do
            if ! printf '%s\n' "$have" | grep -qxF "$f"; then echo "::error::missing from the draft: $f"; missing=1; fi
          done
          [ "$missing" = 0 ] && echo "all twelve files are attached"
          exit "$missing"

  # Mac App Store lane: signed universal .pkg uploaded to TestFlight. Store
  # release stays a manual App Store Connect promotion — this never publishes.
  # Runs only when the MAS secrets exist; a repo without them (or a fork) gets
  # a skipped lane, never a red build.
  mas:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Secrets can't be read in step `if:` conditions — surface their
      # presence as a step output the rest of the lane keys off.
      - name: Check for Mac App Store secrets
        id: gate
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$MAS_CERT_P12" ] && [ -n "$MAS_PROVISIONING_PROFILE" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MAS lane skipped — missing MAS_CERT_P12 / MAS_PROVISIONING_PROFILE / APPLE_API_KEY_P8"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - if: steps.gate.outputs.enabled == 'true'
        run: npm run build

      # MAS_CERT_P12 is one base64 .p12 holding BOTH identities the mas target
      # signs with: "Apple Distribution" (app) and "Mac Installer Distribution"
      # (pkg). Same CSC_LINK temp-keychain mechanism as the Developer ID lane —
      # auto-discovery must stay on for electron-builder to find them. The
      # certificate reaches this step alone, in its own env, never $GITHUB_ENV:
      # npm ci, the build and the TestFlight upload run without it.
      # buildVersion (CFBundleVersion) = run number so every upload is unique;
      # App Store Connect rejects a reused build number for the same version.
      - name: Package Mac App Store build
        if: steps.gate.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.MAS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/mas.provisionprofile"
          npx electron-builder --mac mas --universal --publish never \
            -c.mas.provisioningProfile="$RUNNER_TEMP/mas.provisionprofile" \
            -c.buildVersion="$GITHUB_RUN_NUMBER"

      # fastlane ships in the macOS runner image; pilot uploads via the App
      # Store Connect API key (no Apple ID / 2FA involved). Skip waiting for
      # processing — TestFlight availability shows up in ASC when Apple's done.
      - name: Upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # the key file goes when the step ends, as the Developer ID lane's does
          trap 'rm -f "$RUNNER_TEMP/asc_key.json"' EXIT
          jq -n --arg kid "$APPLE_API_KEY_ID" --arg iss "$APPLE_API_ISSUER_ID" --arg key "$APPLE_API_KEY_P8" \
            '{key_id: $kid, issuer_id: $iss, key: $key, in_house: false}' > "$RUNNER_TEMP/asc_key.json"
          # The signed pkg lands next to the .app in dist/mas-universal/, not dist/ root.
          PKG=$(find dist -name '*.pkg' -print -quit)
          if [ -z "$PKG" ]; then
            echo "no .pkg found under dist/ — packaging produced:" && find dist -maxdepth 2 -print
            exit 1
          fi
          echo "uploading $PKG"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --pkg "$PKG" \
            --app_platform osx \
            --skip_waiting_for_build_processing true

      # Unlike the Developer ID lane this pkg is NOT attached to a Release —
      # it goes to TestFlight — so the artifact is the only local copy and is
      # worth keeping. Short retention all the same: TestFlight holds the build,
      # and a ~200MB pkg per run at the 90-day default is what filled the
      # Actions storage allowance.
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tastytunes-mas
          retention-days: 7
          path: dist/**/*.pkg
          if-no-files-found: ignore
