name: Release

# Builds installers and attaches them to a GitHub Release.
# Trigger by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab via workflow_dispatch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # electron-builder uploads release assets
  id-token: write # GitHub OIDC token for Azure Artifact Signing (no stored secret)

jobs:
  build:
    # The `release` environment is what the Entra federated credential trusts
    # (subject repo:mjoblin/tastytunes:environment:release) — without it the
    # azure/login step's OIDC token is rejected. All three legs carry the
    # environment; only the Windows leg logs in.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # universal = one dmg/zip for Intel AND Apple Silicon (plain
            # --mac on the arm64 runner would ship Apple-Silicon-only)
            args: --mac --universal
          - os: windows-latest
            # arch comes from electron-builder.yml (x64 + arm64, one
            # dual-arch NSIS installer); the packaging step routes through
            # scripts/build-win.mjs, which pins the 7z filter
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Tag builds refuse to run unless the tag agrees with package.json —
      # package.json is THE version (electron-builder bakes it into the
      # artifacts, the app's About, and the update feed); the tag only names
      # the release. A mismatch would publish a release labeled one version
      # containing another, and the in-app update check (latest release tag
      # vs baked version) would offer the "new" version forever.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json $PKG — bump package.json on main, then re-tag (dev/tag-release.sh derives the tag for you)."
            exit 1
          fi
          echo "Version check OK: $TAG"

      # Import macOS signing/notarization credentials when the repo secrets
      # exist. Absent secrets (e.g. on a fork) disable identity auto-discovery
      # so the build falls through to unsigned, notarization skipped.
      # Note: auto-discovery must stay ON when CSC_LINK is set — it is how
      # electron-builder finds the imported cert in its temporary keychain.
      - name: Set up macOS signing credentials
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            {
              echo "CSC_LINK=$MAC_CERT_P12"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - run: npm run build

      # Azure Artifact Signing auth for the Windows build. OIDC only — no
      # long-lived secret exists anywhere; the exchanged token is scoped to
      # the signer role on the redactedcatsigning account. build-win.mjs
      # turns signing on when it sees AZURE_TENANT_ID in the env.
      - name: Azure login for Artifact Signing
        if: matrix.os == 'windows-latest'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Expose Azure signing env
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"

      # On a tag: build and upload the installers to the GitHub Release.
      # On manual runs: build only; artifacts are attached to the workflow run.
      # Windows goes through scripts/build-win.mjs — it pins the 7z filter, and
      # without it the arm64 installer ships broken (see that file).
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: ${{ matrix.os == 'windows-latest' && 'npm run dist:win -- --publish always' || format('npx electron-builder {0} --publish always', matrix.args) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ${{ matrix.os == 'windows-latest' && 'npm run dist:win -- --publish never' || format('npx electron-builder {0} --publish never', matrix.args) }}

      # MANUAL RUNS ONLY. On a tag the installers are already attached to the
      # GitHub Release by --publish always above, and release assets do NOT
      # count against the Actions storage allowance — uploading them here too
      # just stores ~600MB of the same files a second time, per release, where
      # they DO count. Manual runs have no Release to attach to, so that is the
      # one case the artifact earns its keep.
      # Retention is short for the same reason: these are throwaway test builds,
      # and the default (90 days) is what quietly filled the allowance.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: tastytunes-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore
