name: CI

# The gate on every push and pull request: typecheck, lint, format check and
# the unit tests, via the same npm run check the Release workflow runs before
# it builds. Linux only and no packaging: the release legs already prove the
# build on each OS, and this is the check that should answer in a minute or
# two, not the one that ships anything.

on:
  push:
    branches: ['**']
  pull_request:

# read-only: this job only checks out and runs the gate
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # the gate never launches Electron, and since Electron 42 its npm package fetches the binary
      # only when first asked for, so npm ci downloads none
      - run: npm ci

      # typecheck + lint + format:check + unit tests, as npm run check locally
      - run: npm run check
