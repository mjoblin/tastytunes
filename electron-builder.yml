appId: com.redactedcat.tastytunes
productName: TastyTunes
# Where releases live — used by `--publish always` on tag builds AND baked into
# the app (app-update.yml) so electron-updater knows its feed.
publish:
  provider: github
  owner: mjoblin
  repo: tastytunes
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # Tray icons. electron-vite's ?asset compiles to a path relative to out/main,
  # NOT a copy into out/ — so the directory has to be packaged alongside it or
  # the menu-bar icon is missing in release builds only. Reading them from
  # inside the asar is fine (Electron patches fs), so no asarUnpack.
  - resources/**
npmRebuild: false
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip # electron-updater on macOS updates from the zip, not the dmg
  # Signing/notarization credentials come from the environment (CSC_LINK,
  # CSC_KEY_PASSWORD, APPLE_API_KEY/_ID/_ISSUER). Without them the build is
  # unsigned and notarization is skipped with a warning, so local dry runs
  # and credential-less CI keep working.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  # x64 plus arm64 in ONE dual-arch installer: NSIS embeds both payloads and
  # picks at install time. A single artifact keeps electron-updater safe (one
  # latest.yml entry serves both arches) and spares Windows-on-ARM users the
  # x64-under-emulation fallback. Pinning the arch list here also means a bare
  # dist:win builds what users get, not the host arch; explicit --x64/--arm64
  # still narrows to one arch for quick tests. The arm64 payload only decodes
  # because of the BCJ filter pin in scripts/build-win.mjs — see there.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  # A half-extracted payload used to install "successfully" and leave a
  # shortcut to an .exe that was never written (live-hit on Windows 11 ARM,
  # 2026-08-03). electron-builder's own script does not check the extraction
  # result, so this adds the verification — see build/installer.nsh.
  include: build/installer.nsh
linux:
  # x64 plus arm64 — the arm64 AppImage covers 64-bit Raspberry Pi OS
  # (Pi 4/5 with a screen; pure-JS deps, so it's a cross-pack, no compile).
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Audio
