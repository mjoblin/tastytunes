appId: com.redactedcat.tastytunes
productName: TastyTunes
# Where releases live — used by `--publish always` on tag builds AND baked into
# the app (app-update.yml) so electron-updater knows its feed.
publish:
  provider: github
  owner: mjoblin
  repo: tastytunes
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # Tray icons. electron-vite's ?asset compiles to a path relative to out/main,
  # NOT a copy into out/ — so the directory has to be packaged alongside it or
  # the menu-bar icon is missing in release builds only. Reading them from
  # inside the asar is fine (Electron patches fs), so no asarUnpack.
  - resources/**
npmRebuild: false
# VERSIONLESS ARTIFACT NAMES for everything a human downloads (decided
# 2026-08-04, for the website's download buttons): GitHub's
# releases/latest/download/<asset> endpoint gives each asset a stable URL
# only if the NAME is stable, so the site's three links are set once and
# survive every release. The mac ZIP keeps the default VERSIONED name — it
# is the updater's artifact, referenced inside latest-mac.yml, and no human
# ever sees it. Windows/Linux installers are ALSO update artifacts, but each
# release's latest*.yml names its own assets, so versionless works there.
# Costs, accepted: a downloaded file doesn't carry its version in the name
# (the installed app shows it in Settings' tab rail), and linking an OLDER
# release means hand-building the URL.
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip # electron-updater on macOS updates from the zip, not the dmg
  # Signing/notarization credentials come from the environment (CSC_LINK,
  # CSC_KEY_PASSWORD, APPLE_API_KEY/_ID/_ISSUER). Without them the build is
  # unsigned and notarization is skipped with a warning, so local dry runs
  # and credential-less CI keep working.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    # macOS 15+ shows a local-network consent prompt the first time the app
    # touches the LAN — this string appears in that dialog. It was carried
    # only by the store lane (apple branch) at first, and the v0.1.0 draft's
    # dmg shipped without it: the direct build hit the same consent system
    # and, on a machine with stale permission state, was silently denied —
    # unicast AND multicast both dropped, discovery blind, reconnect forever
    # (live-hit on the release dmg, 2026-08-04). Every mac flavor needs it.
    NSLocalNetworkUsageDescription: >-
      TastyTunes uses your local network to find and control Cambridge Audio
      StreamMagic streamers and to browse your media servers.
    # Only HTTPS/standard encryption — pre-answers App Store Connect's export
    # compliance question so TestFlight builds don't stall on it.
    ITSAppUsesNonExemptEncryption: false
dmg:
  artifactName: ${productName}.${ext}
win:
  # x64 plus arm64 in ONE dual-arch installer: NSIS embeds both payloads and
  # picks at install time. A single artifact keeps electron-updater safe (one
  # latest.yml entry serves both arches) and spares Windows-on-ARM users the
  # x64-under-emulation fallback. Pinning the arch list here also means a bare
  # dist:win builds what users get, not the host arch; explicit --x64/--arm64
  # still narrows to one arch for quick tests. The arm64 payload only decodes
  # because of the BCJ filter pin in scripts/build-win.mjs — see there.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  # NO arch in this name, deliberately: an artifactName containing the arch
  # placeholder silently switches NSIS from the one dual-arch installer back
  # to per-arch installers (NsisTarget splits on it).
  artifactName: ${productName}-Setup.${ext}
  # A half-extracted payload used to install "successfully" and leave a
  # shortcut to an .exe that was never written (live-hit on Windows 11 ARM,
  # 2026-08-03). electron-builder's own script does not check the extraction
  # result, so this adds the verification — see build/installer.nsh.
  include: build/installer.nsh
linux:
  # x64 plus arm64 — the arm64 AppImage covers 64-bit Raspberry Pi OS
  # (Pi 4/5 with a screen; pure-JS deps, so it's a cross-pack, no compile).
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  # Versionless like the rest, but the arch STAYS: two AppImages share one
  # release, so the arch is what keeps their names distinct.
  artifactName: ${productName}-${arch}.${ext}
  category: Audio
